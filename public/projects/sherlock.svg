<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgSh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgSh)" />

  <!-- Victorian London Brick Wall & Silhouette -->
  <g opacity="0.15">
    <line x1="0" y1="90" x2="800" y2="90" stroke="#FFFFFF" stroke-width="1" />
    <line x1="0" y1="180" x2="800" y2="180" stroke="#FFFFFF" stroke-width="1" />
    <line x1="0" y1="270" x2="800" y2="270" stroke="#FFFFFF" stroke-width="1" />
    <line x1="0" y1="360" x2="800" y2="360" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Gas Lamp Light on Right -->
  <circle cx="650" cy="180" r="140" fill="url(#lampGlow)" />
  <line x1="650" y1="0" x2="650" y2="160" stroke="#1F2937" stroke-width="5" />
  <polygon points="635,160 665,160 660,195 640,195" fill="#374151" stroke="#FDE047" stroke-width="1" />
  <circle cx="650" cy="180" r="8" fill="#FEF08A" />

  <!-- Big Detective Magnifying Glass Overlay Silhouette -->
  <g transform="translate(560, 190) rotate(-25)">
    <circle cx="60" cy="60" r="70" fill="none" stroke="#F59E0B" stroke-width="10" opacity="0.7" />
    <circle cx="60" cy="60" r="62" fill="#38BDF8" fill-opacity="0.08" />
    <rect x="52" y="130" width="16" height="90" rx="6" fill="#78350F" stroke="#F59E0B" stroke-width="2" />
    <!-- Fingerprint / Clue inside lens -->
    <path d="M 45 40 Q 60 25 75 40 Q 90 60 75 80" stroke="#FDE047" stroke-width="2" fill="none" opacity="0.4" />
    <path d="M 35 50 Q 60 30 85 50 Q 95 70 85 90" stroke="#FDE047" stroke-width="2" fill="none" opacity="0.3" />
  </g>

  <!-- Left Side: Baker Street Case File Card -->
  <rect x="40" y="40" width="380" height="370" rx="16" fill="#111827" fill-opacity="0.9" stroke="#374151" stroke-width="1.5" />

  <!-- Category & Case Badges -->
  <g transform="translate(64, 68)">
    <rect width="160" height="28" rx="8" fill="#831843" />
    <text x="12" y="19" fill="#FCE7F3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1">MISTERI &amp; DETEKTIF</text>
  </g>

  <g transform="translate(235, 68)">
    <rect width="115" height="28" rx="8" fill="#1E293B" stroke="#475569" />
    <text x="12" y="19" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="700">DOSSIER #221B</text>
  </g>

  <!-- Book Title -->
  <text x="64" y="145" fill="#F8FAFC" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="700">Skandal di Bohemia</text>
  <text x="64" y="174" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Sir Arthur Conan Doyle</text>

  <!-- Subtitle -->
  <text x="64" y="210" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">
    Kisah Ikonik Irene Adler — "Sang Wanita"
  </text>
  <text x="64" y="230" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
    Detektif Baker Street &amp; Dr. John H. Watson
  </text>

  <!-- Detective Quote Box -->
  <rect x="64" y="255" width="332" height="72" rx="8" fill="#1F2937" fill-opacity="0.7" stroke="#374151" />
  <text x="78" y="280" fill="#FDE047" font-family="Georgia, serif" font-style="italic" font-size="11">"Bagi Sherlock Holmes, dia selalu dipanggil sebagai</text>
  <text x="78" y="298" fill="#FDE047" font-family="Georgia, serif" font-style="italic" font-size="11">Sang Wanita. Satu-satunya sosok yang menundukkan</text>
  <text x="78" y="316" fill="#FDE047" font-family="Georgia, serif" font-style="italic" font-size="11">kejeniusannya."</text>

  <!-- Bottom Pills -->
  <g transform="translate(64, 350)">
    <text x="0" y="18" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="600">SKU: MYK-SH-02</text>
    <text x="140" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• 5,200 perkataan</text>
    <rect x="250" y="2" width="70" height="24" rx="6" fill="#F59E0B" />
    <text x="262" y="18" fill="#000000" font-family="sans-serif" font-size="11" font-weight="800">RM 24.50</text>
  </g>
</svg>
