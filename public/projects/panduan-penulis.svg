<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgPanduan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E" />
      <stop offset="60%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#021C16" />
    </linearGradient>
    <linearGradient id="royaltyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgPanduan)" />

  <!-- Code / Studio Grid Lines Background -->
  <g opacity="0.12">
    <circle cx="650" cy="220" r="180" fill="#34D399" filter="blur(70px)" />
    <line x1="450" y1="0" x2="450" y2="450" stroke="#34D399" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Interactive Studio IDE / Dashboard Mockup on Right -->
  <g transform="translate(460, 60)">
    <!-- Browser Mock Window -->
    <rect width="300" height="330" rx="16" fill="#042F2E" stroke="#10B981" stroke-width="1.5" />
    <!-- Window Bar -->
    <rect width="300" height="36" rx="16" fill="#022120" />
    <circle cx="20" cy="18" r="4.5" fill="#EF4444" />
    <circle cx="34" cy="18" r="4.5" fill="#F59E0B" />
    <circle cx="48" cy="18" r="4.5" fill="#10B981" />
    <rect x="70" y="10" width="160" height="16" rx="6" fill="#ffffff" fill-opacity="0.1" />
    <text x="150" y="22" text-anchor="middle" fill="#A7F3D0" font-family="monospace" font-size="9">karyadigital.com/studio</text>

    <!-- 95% Royalty Big Metric Badge -->
    <g transform="translate(20, 50)">
      <rect width="260" height="85" rx="12" fill="#064E3B" fill-opacity="0.7" stroke="#34D399" stroke-opacity="0.4" />
      <text x="16" y="28" fill="#A7F3D0" font-family="sans-serif" font-size="11" font-weight="700">MODEL AGIHAN TELUS</text>
      <text x="16" y="65" fill="url(#royaltyGrad)" font-family="sans-serif" font-size="32" font-weight="800">95%</text>
      <text x="96" y="55" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Royalti Penulis</text>
      <text x="96" y="72" fill="#A7F3D0" font-family="sans-serif" font-size="10">Kredit Terus Tanpa Orang Tengah</text>
    </g>

    <!-- Feature Checklist in Mockup -->
    <g transform="translate(20, 150)">
      <rect width="260" height="150" rx="12" fill="#021C16" fill-opacity="0.8" stroke="#10B981" stroke-opacity="0.2" />
      
      <!-- Item 1 -->
      <circle cx="24" cy="30" r="6" fill="#10B981" />
      <text x="38" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600">Enjin E-Reader Canvas Khas</text>

      <!-- Item 2 -->
      <circle cx="24" cy="65" r="6" fill="#10B981" />
      <text x="38" y="69" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600">Sandaran Luar Talian (IndexedDB)</text>

      <!-- Item 3 -->
      <circle cx="24" cy="100" r="6" fill="#10B981" />
      <text x="38" y="104" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600">Integrasi Pembayaran FPX &amp; Kad</text>

      <!-- Item 4 -->
      <circle cx="24" cy="130" r="6" fill="#EAB308" />
      <text x="38" y="134" fill="#FDE047" font-family="sans-serif" font-size="11" font-weight="600">Format Standard EPUB &amp; TXT</text>
    </g>
  </g>

  <!-- Left Side: Digital Publishing Guide Dossier Card -->
  <rect x="40" y="40" width="395" height="370" rx="16" fill="#042F2E" fill-opacity="0.94" stroke="#10B981" stroke-width="1.5" />

  <!-- Category & Badges -->
  <g transform="translate(64, 68)">
    <rect width="180" height="28" rx="8" fill="#065F46" />
    <text x="12" y="19" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1">APLIKASI &amp; PANDUAN</text>
  </g>

  <g transform="translate(255, 68)">
    <rect width="115" height="28" rx="8" fill="#047857" />
    <text x="12" y="19" fill="#D1FAE5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">🚀 RESMI 2026</text>
  </g>

  <!-- Book Title -->
  <text x="64" y="145" fill="#FFFFFF" font-family="'Cinzel', Georgia, serif" font-size="22" font-weight="700">Panduan Penerbitan &amp;</text>
  <text x="64" y="174" fill="url(#royaltyGrad)" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700">Ekosistem Digital Penulis</text>

  <!-- Author -->
  <text x="64" y="210" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Tim Studio Karya Digital</text>
  <text x="64" y="230" fill="#A7F3D0" opacity="0.8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Sistem Autonomi Penulis, Pelesenan ISBN &amp; Strategi Pelancaran</text>

  <!-- Guide Highlight Box -->
  <rect x="64" y="255" width="347" height="72" rx="8" fill="#021C16" fill-opacity="0.8" stroke="#10B981" stroke-opacity="0.3" />
  <text x="78" y="280" fill="#D1FAE5" font-family="Georgia, serif" font-style="italic" font-size="11">"Setiap penulis berhak memiliki kawalan ke atas karya</text>
  <text x="78" y="298" fill="#D1FAE5" font-family="Georgia, serif" font-style="italic" font-size="11">mereka. Panduan lengkap dari manuskrip mentah hingga</text>
  <text x="78" y="316" fill="#D1FAE5" font-family="Georgia, serif" font-style="italic" font-size="11">menjana jualan pertama di platform web interaktif."</text>

  <!-- Bottom Pills -->
  <g transform="translate(64, 350)">
    <text x="0" y="18" fill="#34D399" font-family="monospace" font-size="11" font-weight="600">SKU: MYK-GDE-06</text>
    <text x="145" y="18" fill="#A7F3D0" opacity="0.8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• 6,200 perkataan</text>
    <rect x="260" y="2" width="70" height="24" rx="6" fill="#10B981" />
    <text x="272" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="800">PERCUMA</text>
  </g>
</svg>
