  <!-- 2. Typography on Right -->
  <text x="200" y="68" fill="#006B57" font-family="'Playfair Display', Georgia, serif" font-size="48" font-weight="800" letter-spacing="-0.5">Karya Digital</text>
  <text x="202" y="98" fill="#006B57" opacity="0.85" font-family="'Playfair Display', 'Lora', Georgia, serif" font-size="20" font-style="italic" font-weight="600" letter-spacing="1">Berkarya Tanpa Sempadan</text>
