  </text>

  <!-- Description paragraph -->
  <text x="80" y="425" fill="#D1FAE5" opacity="0.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
