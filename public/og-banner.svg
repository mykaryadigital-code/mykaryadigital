    <g transform="translate(30, 70)">
      <rect width="320" height="150" rx="16" fill="#006B57" fill-opacity="0.3" stroke="#34D399" stroke-opacity="0.3" />
      <text x="24" y="44" fill="#A7F3D0" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">PROJEK PILIHAN</text>
      <text x="24" y="74" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">Karya E-Reader Interaktif</text>
      <text x="24" y="100" fill="#E2E8F0" font-family="sans-serif" font-size="13">Pratonton Bab • Mod Gelap • Nota Suara</text>
      <rect x="24" y="112" width="90" height="22" rx="11" fill="#34D399" />
      <text x="69" y="127" text-anchor="middle" fill="#063F35" font-family="sans-serif" font-size="11" font-weight="800">LIVE DEMO</text>
