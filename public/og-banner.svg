    <g transform="translate(30, 240)">
      <rect width="320" height="100" rx="16" fill="#063F35" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.1" />
      <text x="24" y="36" fill="#EAB308" font-family="sans-serif" font-size="12" font-weight="700">SISTEM ROYALTI &amp; E-DAGANG</text>
      <text x="24" y="62" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">FPX • Kad • TNG eWallet</text>
      <text x="24" y="84" fill="#A7F3D0" font-family="sans-serif" font-size="12">Agihan Segera: Penulis 95% | Platform 5%</text>
    </g>
