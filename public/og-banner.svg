<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042822" />
      <stop offset="40%" stop-color="#063F35" />
      <stop offset="100%" stop-color="#021411" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="150" r="320" fill="#006B57" opacity="0.35" filter="blur(80px)" />
  <circle cx="1050" cy="480" r="300" fill="#047857" opacity="0.25" filter="blur(80px)" />
  <circle cx="950" cy="150" r="220" fill="#EAB308" opacity="0.12" filter="blur(90px)" />

  <!-- Architectural Dot Grid Overlay -->
  <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.07" />
  </pattern>
  <rect width="1200" height="630" fill="url(#dotGrid)" />

  <!-- Outer Frame -->
  <rect x="36" y="36" width="1128" height="558" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

