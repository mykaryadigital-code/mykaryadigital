    <rect width="380" height="44" rx="24" fill="#021411" fill-opacity="0.6" />
    <circle cx="28" cy="22" r="5" fill="#EF4444" />
    <circle cx="44" cy="22" r="5" fill="#F59E0B" />
    <circle cx="60" cy="22" r="5" fill="#10B981" />
    <rect x="85" y="12" width="210" height="20" rx="6" fill="#ffffff" fill-opacity="0.1" />
    <text x="190" y="26" text-anchor="middle" fill="#ffffff" fill-opacity="0.5" font-family="monospace" font-size="10">mykaryadigital.com</text>

