  </text>
  <text x="80" y="455" fill="#D1FAE5" opacity="0.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    dengan sokongan sandaran luar talian IndexedDB.
  </text>

  <!-- 3 Feature Badges Row -->
  <g transform="translate(80, 500)">
    <rect width="180" height="42" rx="12" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="90" y="26" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">⚡ Responsif &amp; Laju</text>

    <g transform="translate(200, 0)">
