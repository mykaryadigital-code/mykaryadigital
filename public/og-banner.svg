    <circle cx="22" cy="19" r="5" fill="#34D399" />
    <text x="36" y="24" fill="#D1FAE5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1">STUDIO &amp; HAB PRODUK DIGITAL</text>
  </g>

  <!-- Left Content Column -->
  <!-- Logo & Title -->
  <g transform="translate(80, 160)">
    <!-- Brand KD Monogram Badge -->
    <g transform="translate(0, 0)">
      <rect width="76" height="76" rx="20" fill="#006B57" stroke="#EAB308" stroke-width="2" />
      <g fill="#FFFFFF" transform="translate(13, 16) scale(0.08)">
        <path d="M 120 110 L 255 110 L 255 128 C 235 128 224 138 224 160 L 224 450 C 224 472 235 482 255 482 L 255 500 L 120 500 L 120 482 C 140 482 151 472 151 450 L 151 160 C 151 138 140 128 120 128 Z" />
        <path d="M 224 285 L 395 110 L 442 110 L 442 128 C 420 128 406 138 388 160 L 268 290 L 375 422 C 398 450 418 462 445 464 L 445 482 C 415 482 382 475 352 442 L 252 316 L 224 345 L 224 285 Z" />
        <path fill="#EAB308" d="M 240 310 L 345 428 C 405 496, 488 528, 595 528 C 715 528, 788 496, 820 460 C 830 450, 835 440, 838 428 C 830 460, 762 546, 595 546 C 475 546, 388 510, 318 430 L 224 324 Z" />
        <path d="M 335 110 L 445 110 L 445 128 C 426 128 416 138 416 160 L 416 450 C 416 472 426 482 445 482 L 445 500 L 335 500 L 335 482 C 354 482 364 472 364 450 L 364 160 C 364 138 354 128 335 128 Z" />
        <path fill-rule="evenodd" clip-rule="evenodd" d="M 416 110 H 545 C 690 110, 792 196, 792 305 C 792 414, 690 500, 545 500 H 416 V 464 H 540 C 652 464, 725 398, 725 305 C 725 212, 652 146, 540 146 H 416 V 110 Z" />
      </g>
    </g>

    <text x="96" y="42" fill="#FFFFFF" font-family="'Cinzel', Georgia, serif" font-size="38" font-weight="700" letter-spacing="1">MyKarya Digital</text>
    <text x="96" y="68" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">Ekosistem Penerbitan &amp; Projek Web Interaktif Malaysia</text>
  </g>

  <!-- Big Catchy Headline -->
  <text x="80" y="315" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Solusi Projek Web, E-Reader Interaktif &amp;
  </text>
  <text x="80" y="375" fill="url(#goldGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
